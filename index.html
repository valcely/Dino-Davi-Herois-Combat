```
<!-- MENU PRINCIPAL -->
<div id="menuScreen" class="overlay">
  <div class="menu-box">
    <h1 class="game-title">DINO DAVI</h1>
    <h2 class="game-subtitle">HERÓIS COMBAT</h2>
    <button class="btn btn-start" onclick="goToHeroSelect()">INICIAR</button>
    <button class="btn btn-info" onclick="goToHowTo()">COMO JOGAR</button>
    <p class="menu-credits">v1.0</p>
  </div>
</div>

<!-- SELEÇÃO DE HERÓI -->
<div id="heroSelectScreen" class="overlay hidden">
  <div class="header">
    <button class="back-btn" onclick="goToMenu()">VOLTAR</button>
    <h2>ESCOLHA SEU HERÓI</h2>
  </div>
  <div class="hero-grid" id="heroGrid"></div>
</div>

<!-- SELEÇÃO DE INIMIGO -->
<div id="enemySelectScreen" class="overlay hidden">
  <div class="header">
    <button class="back-btn" onclick="goToHeroSelect()">VOLTAR</button>
    <h2>ESCOLHA SEU INIMIGO</h2>
  </div>
  <div class="enemy-grid" id="enemyGrid"></div>
</div>

<!-- TELA DE JOGO -->
<div id="gameScreen" class="overlay hidden">
  <div id="gameHUD" class="hud">
    <div class="hud-hero">
      <span id="heroName" class="hud-label">HEROI</span>
      <div id="heroHPBar" class="hp-bar">
        <div id="heroHPFill" class="hp-fill"></div>
      </div>
      <span id="heroHP" class="hud-value">100/100</span>
    </div>
    <div class="hud-center">
      <span id="distance" class="hud-value">0m</span>
      <span id="score" class="hud-value">0 PTS</span>
    </div>
    <div class="hud-enemy">
      <span id="enemyName" class="hud-label">INIMIGO</span>
      <div id="enemyHPBar" class="hp-bar">
        <div id="enemyHPFill" class="hp-fill"></div>
      </div>
      <span id="enemyHP" class="hud-value">100/100</span>
    </div>
  </div>
  <div id="gameControls" class="controls">
    <button id="jumpBtn" class="control-btn jump" onmousedown="jumpPlayer()" ontouchstart="jumpPlayer()">PULAR</button>
    <button id="attackBtn" class="control-btn attack" onmousedown="attackPlayer()" ontouchstart="attackPlayer()">ATACAR</button>
  </div>
</div>

<!-- TELA DE VITÓRIA -->
<div id="winScreen" class="overlay hidden">
  <div class="result-box win">
    <h2>VITÓRIA!</h2>
    <p id="winStats"></p>
    <button class="btn btn-large" onclick="goToHeroSelect()">PROXIMA BATALHA</button>
  </div>
</div>

<!-- TELA DE DERROTA -->
<div id="loseScreen" class="overlay hidden">
  <div class="result-box lose">
    <h2>DERROTA</h2>
    <p id="loseStats"></p>
    <button class="btn btn-large" onclick="goToHeroSelect()">TENTAR NOVAMENTE</button>
  </div>
</div>

<!-- TELA COMO JOGAR -->
<div id="howToScreen" class="overlay hidden">
  <div class="info-box">
    <h2>COMO JOGAR</h2>
    <div class="info-content">
      <p><strong>OBJETIVO:</strong> Derrote o dinossauro!</p>
      <p><strong>PULAR:</strong> ESPACO / W / SETA CIMA</p>
      <p><strong>ATACAR:</strong> Z / X</p>
      <p><strong>9 HEROIS:</strong> Escolha 1</p>
      <p><strong>9 INIMIGOS:</strong> Escolha seu oponente</p>
    </div>
    <button class="btn btn-large" onclick="goToMenu()">VOLTAR</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>
